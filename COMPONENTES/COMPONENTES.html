<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Componentes</title>
    <style>
    button {
        background-color: #4F794A;
        color: #FFFFFF;
        font-family: Arial, Helvetica, sans-serif;
        border-radius: 6px;
        padding-left: 16px;
        padding-right: 16px;
        height: 40px;
        border: none;
        box-shadow: 1px 1px 4px 0 rgba(0, 0, 0, 0.4);
    }
    button:hover {
    background-color: #3B5A36;
    box-shadow: 1px 1px 4px 0 rgba(0, 0, 0, 0.4);
    cursor: pointer;
}
button:active {
    background-color: #293D26;
    box-shadow: none;
}
</style>
</head>
<body>
    <button>BOTÓN</button>
</body>
</html>
